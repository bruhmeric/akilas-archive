# ============================================================================
# Akila's Archive — base compose file (app only)
#
# Started by deploy/deploy.sh. The optional Caddy reverse proxy lives in
# docker-compose.caddy.yml (an overlay file), so this works with every
# compose version — no `--profile` flag needed:
#
#   app only:   docker compose -p akilas-archive -f deploy/docker-compose.yml up -d --build
#   app+caddy:  docker compose -p akilas-archive -f deploy/docker-compose.yml \
#                             -f deploy/docker-compose.caddy.yml up -d --build
# ============================================================================

services:
  archive:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: akilas-archive:latest
    container_name: akilas-archive
    restart: unless-stopped
    user: "1001:1001"
    ports:
      # Direct access on the VPS (pick any free port; 8080 is taken by your other app).
      # Caddy talks to the container directly, so this is optional but handy for testing.
      - "3001:3000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=file:/app/data/akilas-archive.db
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
